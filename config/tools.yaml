# desloper tools map — the scanner contract (scanner -> source -> lang -> invocation).
# This file is documentation-as-config; setup-vendors.sh mirrors it.
# NOTE on `name`: it is the VENDOR DIRECTORY name under vendors/ — for most
# entries it coincides with the scanner id in report tool_runs, but not
# always.
#
# BUILT-IN scanners (no vendors, no network, data under config/dictionaries):
#   - phrases       (all langs) — AI cliche/bureaucratic dictionaries
#                    extracted from texthumanize (MIT) + series-distilled
#                    KO/VI/JA lists. Replaced the texthumanize system CLI.
#   - metrics       (en) — vendored dependency-free lib of
#                    Aboudjem/humanizer-skill (MIT): lexical tells +
#                    burstiness + trigram repetition + MATTR.
#   - viet-lint     (vi) — vietnamese-humanizer (MIT, longhang2004)
#                    pattern catalog converted to JSON; dormant upstream
#                    absorbed as data.
#   - ja-lint       (ja) — textlint-ja/textlint-rule-preset-ai-writing
#                    (MIT, azu) converted to JSON; colon-continuation
#                    (kuromojin-dependent) and ai-tech-writing-guideline
#                    (FP-prone) deliberately not absorbed.
#   - es-lint       (es) — dorelysm/naturalizacion-texto-es (MIT)
#                    SUBSTITUTIONS.md tiers 1/3/4 converted to regex
#                    rules + hand-coded repetition detectors (triads,
#                    -mente chains, poder+infinitivo, spaced em-dash
#                    inciso with dialogue-raya guard); Tier-2 vocabulary
#                    lives in the phrases scanner (SERIES_WEAK.es).
#   - desloper      (all) — vendor-independent P0 placeholder scanner.
#   - ru-structural (ru) — built-in structural detectors (fragment
#                    leads, em-dash DENSITY, arrows in prose); thresholds
#                    calibrated on the issue #1 ground truth, no data
#                    files. Presence of the RU dash stays typographic
#                    norm (globally suppressed via exceptions.yaml).

tools:
  - name: humanizer-ru
    source: git https://github.com/ilyautov/humanizer-ru (MIT)
    sha: 7fed91f99700a937b82e0c32094872ba8a5843da
    langs: [ru]
    invoke: "vendors/.venv/bin/python vendors/humanizer-ru/skills/humanizer-ru/scripts/scan.py <file> --genre <essay|academic|news|marketing> --json"
    deps: razdel==0.5.0, pymorphy3==2.0.6 (uv venv)
    mode: audit-only scan.py; rewriting agents deliberately not invoked
    note: genre calibration is vendor-side and runs INSIDE the wrapper
    vendor_exit: "0 clean / 1 findings"

  - name: im-not-ai
    source: git https://github.com/epoko77-ai/im-not-ai (MIT, 5.5k stars)
    sha: 9747f036cdc28a1a8aea4dc71fef1f7846eb96f7
    langs: [ko]
    invoke: "vendors/.venv/bin/python vendors/im-not-ai/scripts/prepare_monolith_input.py --run-dir <tmp-with-01_input.txt> --genre essay"
    mode: deterministic shim ONLY (stdlib); LLM routes (light/standard/heavy) deliberately never invoked
    output: "run_dir=/path risk_band=<low|…> risk_score=N route_hint=…"
    vendor_exit: 0

  - name: natural-japanese
    source: git https://github.com/coji/natural-japanese (MIT, 1.9k stars)
    sha: 74647ae4331e310eb7ac93e3038a133d08be5acd
    langs: [ja]
    invoke: "vendors/.venv/bin/python vendors/natural-japanese/skills/natural-japanese/scripts/lint.py <file> --genre essay --json"
    deps: sudachipy==0.7.0, sudachidict-core==20260723.1 (uv venv)
    mode: audit-only lint.py; deterministic corpus-calibrated detectors only
      (137 human / 406 AI texts, 7 models); the vendor's LLM rewrite skill
      (SKILL.md) is deliberately never invoked
    output: "json {file, stats, findings[]{line, category, excerpt, severity(info|warn|critical), detail, related_lines?}}"
    vendor_exit: "0 always (finding count irrelevant by design); 1 only on input error"

# REMOVED VENDORS (absorbed as data with attribution, config/dictionaries/):
#   texthumanize (system CLI)   -> cliche/bureaucratic dictionaries (en/ru/ko/vi)
#   Aboudjem/humanizer-skill    -> src/scanners/{metrics,vocabulary,tokenize}.js vendored
#   longhang2004/vietnamese-humanizer -> vi-patterns.json (pattern catalog)
#   textlint-ja/textlint-rule-preset-ai-writing -> ja-patterns.json (pattern catalog)
#   dorelysm/naturalizacion-texto-es @ 7eaba75 -> es-patterns.json (tiers 1/3/4;
#     the repo itself is an LLM skill with no deterministic script, so only the
#     data was absorbable — no vendor process exists for ES)
