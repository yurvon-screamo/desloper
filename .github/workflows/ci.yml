name: ci
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test tests/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: astral-sh/setup-uv@v5
      - run: bun install --frozen-lockfile
      - run: bun src/cli.ts --setup
      - name: Golden fixtures audit (exit code + findings per scanner)
        run: |
          set +e
          bun src/cli.ts tests/fixtures --json > report.json
          ec=$?
          set -e
          jq '.summary' report.json
          # Exit policy: findings present (p0+p1 > 0) must yield exit 1.
          test "$ec" -eq 1
          jq -e '.summary.tool_failures == 0' report.json
          jq -e '.summary.p0 == 2' report.json
          # Every scanner must produce at least one finding on the fixtures
          # (regressions to zero-findings must fail CI).
          for t in desloper phrases avoid-ai-writing patterns-en metrics humanizer-ru im-not-ai viet-lint; do
            jq -e --arg t "$t" '[.tool_runs[] | select(.tool==$t) | .findings] | add >= 1' report.json
          done
          jq -e '.language_uncertain | type == "array"' report.json
