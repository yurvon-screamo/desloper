name: ci
on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test tests/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: astral-sh/setup-uv@v5
      - run: bun install --frozen-lockfile
      - run: bun src/cli.ts --setup
      - name: Golden fixtures audit (exit code + findings per scanner)
        run: |
          set +e
          bun src/cli.ts tests/fixtures --json > report.json
          ec=$?
          set -e
          scripts/assert-golden-audit.sh report.json "$ec"

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
          - os: macos-14
            target: bun-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      # Native target only; build.ts smoke-tests it on the spot
      # (cross-compiled artifacts cannot run on this runner).
      - run: bun src/build.ts ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/

  artifact-e2e:
    # Clean room: the binary must work without bun install, without
    # node_modules and without repo vendors — it provisions its own
    # vendor scanners via --setup (the compiled materialization path).
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: bun-linux-x64
          path: dist
      - name: Vendor setup through the binary
        run: |
          chmod +x dist/desloper-*-linux-x64
          DESLOPER_VENDORS="$RUNNER_TEMP/vendors" dist/desloper-*-linux-x64 --setup
      - name: Golden fixtures audit through the artifact
        run: |
          set +e
          DESLOPER_VENDORS="$RUNNER_TEMP/vendors" dist/desloper-*-linux-x64 tests/fixtures --json > report.json
          ec=$?
          set -e
          scripts/assert-golden-audit.sh report.json "$ec"
